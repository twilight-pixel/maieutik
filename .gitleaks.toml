# Détection de secrets (gitleaks), en pre-commit et en CI. Voir docs/09 §4.
title = "Maieutik"

[extend]
useDefault = true

[[rules]]
id = "age-secret-key"
description = "Clé privée age (chiffrement des sauvegardes) : doit rester hors ligne"
regex = '''AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}'''
keywords = ["age-secret-key-1"]

[[rules]]
id = "tor-onion-secret-key"
description = "Clé privée du service onion : quiconque la détient peut usurper l'adresse .onion"
regex = '''== ed25519v1-secret: type0 =='''
keywords = ["ed25519v1-secret"]

[[rules]]
id = "maieutik-session-key"
description = "Clé de signature des jetons de session"
regex = '''(?i)session[_-]?key\s*[:=]\s*['"]?[A-Za-z0-9+/=_-]{32,}'''
keywords = ["session_key", "session-key", "sessionkey"]

[[allowlists]]
description = "Vecteurs de test publics (BIP39, Ed25519, RFC 8785) : jamais de vraie graine"
paths = [
  '''packages/crypto/test/vectors/''',
]
