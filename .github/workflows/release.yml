# Release : déclenchée par un tag vX.Y.Z protégé, après approbation d'un second mainteneur
# (environnement « release »). Produit des artefacts signés que le serveur vérifie avant tout
# déploiement (deploy/deploy.sh). Voir docs/10-ci-cd.md §4 et D12.
#
# Pas de cache dans ce workflow : un cache empoisonné par une PR atteindrait la production.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI complète
    # Syntaxe « $/ » recommandée par zizmor, pas encore reconnue par actionlint 1.7.12 : à adopter
    # dès qu'elle l'est.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write

  publication:
    name: Image, manifeste et signatures
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # release GitHub
      packages: write # image sur GHCR
      id-token: write # signature Sigstore sans clé (identité = ce workflow, à ce tag)
      attestations: write # provenance SLSA
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Construction de l'image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >>"$GITHUB_ENV"
          docker build --no-cache --build-arg MAIEUTIK_VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$image:$VERSION" .

      - name: Manifeste du code client, recalculé depuis l'image
        run: |
          id=$(docker create "$IMAGE:$VERSION")
          docker cp "$id:/app/build/client" client
          docker cp "$id:/app/build/client-manifest.json" client-manifest.json
          docker rm "$id" >/dev/null
          node scripts/ci/client-manifest.mjs generate client --version "$VERSION" --out recalcule.json
          node scripts/ci/client-manifest.mjs compare client-manifest.json recalcule.json

      - name: Configuration de déploiement
        run: |
          epoch=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
            -C deploy -cf - compose.yaml Caddyfile tor | gzip -n >deploy-bundle.tar.gz

      - name: SBOM (SPDX)
        run: |
          docker save "$IMAGE:$VERSION" -o image.tar
          scripts/ci/tool.sh syft docker-archive:image.tar -o spdx-json=sbom.spdx.json

      - name: Publication de l'image
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          digest=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$digest" >image-digest.txt
          echo "DIGEST=$digest" >>"$GITHUB_ENV"

      - name: Signatures Sigstore
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE@$DIGEST"
          for f in client-manifest.json deploy-bundle.tar.gz; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Provenance SLSA
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          root=$(node -p 'require("./client-manifest.json").root')
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$VERSION"
          cat >notes.md <<EOF
          Image : \`$IMAGE@$DIGEST\`
          Racine du code client : \`$root\`

          Vérifier la signature :

          \`\`\`
          cosign verify-blob --bundle client-manifest.json.sigstore.json \\
            --certificate-identity "$identity" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com client-manifest.json
          \`\`\`

          Vérifier le site en production : \`scripts/ci/verify-production.sh <url>\` (voir D12).
          EOF
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md \
            image-digest.txt sbom.spdx.json \
            client-manifest.json client-manifest.json.sigstore.json \
            deploy-bundle.tar.gz deploy-bundle.tar.gz.sigstore.json
