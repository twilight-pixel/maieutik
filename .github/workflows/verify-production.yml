# Vérification externe, chaque heure : le code client servi (clearnet et onion) doit être
# exactement celui de la release signée qu'il annonce. Détecte une compromission du serveur
# qui modifierait le JavaScript pour voler des clés (D12). Un échec notifie les mainteneurs.
#
# Variables du dépôt (Settings > Variables) : PRODUCTION_URL, PRODUCTION_ONION_URL.
name: Vérification de la production

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  clearnet:
    name: Accès clearnet
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Code servi contre manifeste signé, certificat TLS
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: scripts/ci/verify-production.sh "$BASE"

  onion:
    name: Accès onion
    if: vars.PRODUCTION_ONION_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Client Tor
        env:
          BASE: ${{ vars.PRODUCTION_ONION_URL }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tor
          for _ in $(seq 1 36); do
            curl -fs --socks5-hostname 127.0.0.1:9050 -o /dev/null "$BASE/" && exit 0
            sleep 5
          done
          echo "::error::Service onion injoignable"
          exit 1
      - name: Code servi contre manifeste signé
        env:
          BASE: ${{ vars.PRODUCTION_ONION_URL }}
        run: scripts/ci/verify-production.sh "$BASE" 127.0.0.1:9050
